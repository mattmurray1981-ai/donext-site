[build]
  publish = "."

# Netlify Forms are declared in index.html (weekend-brief, weekday-morning).
# No build command — static site. Production publish follows your Netlify
# branch settings (usually main). PR branches get Deploy Previews if enabled.

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/now"
  to = "/now.html"
  status = 200

[[redirects]]
  from = "/now/"
  to = "/now.html"
  status = 200


# Bristol city lane (parallel to Cardiff — do not overwrite /now)

[[redirects]]
  from = "/bristol/now"
  to = "/bristol-now.html"
  status = 200

[[redirects]]
  from = "/bristol/now/"
  to = "/bristol-now.html"
  status = 200

[[redirects]]
