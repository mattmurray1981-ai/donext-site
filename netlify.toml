functionsDirectory = "./netlify/functions"
functionsDirectoryOrigin = "config"
redirectsOrigin = "config"
plugins = []
headers = []

[build]
publish = "."
publishOrigin = "config"
functions = "./netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]

# Bristol has its own directory page, metadata, catalog and signup confirmation.
[[redirects]]
from = "/bristol"
to = "/bristol/index.html"
status = 200
force = true

[[redirects]]
from = "/bristol/"
to = "/bristol/index.html"
status = 200
force = true

[[redirects]]
from = "/bristol/index.html"
to = "/bristol/"
status = 301
force = true

[[redirects]]
from = "/bristol/now"
to = "/bristol/"
status = 302
force = true

[[redirects]]
from = "/bristol/now/"
to = "/bristol/"
status = 302
force = true

[[redirects]]
from = "/bristol/thank-you/index.html"
to = "/bristol/thank-you/"
status = 301
force = true

[[redirects]]
from = "/birmingham"
to = "/birmingham.html"
status = 200
force = false

[[redirects]]
from = "/birmingham/"
to = "/birmingham.html"
status = 200
force = false

[[redirects]]
from = "/birmingham/now"
to = "/birmingham-now.html"
status = 200
force = false

[[redirects]]
from = "/birmingham/now/"
to = "/birmingham-now.html"
status = 200
force = false

# Internal research remains in the preserved deployment snapshot, but must not
# be served publicly. Force the 404 so existing files cannot shadow these rules.
[[redirects]]
from = "/data"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/data/"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/data/sourcing"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/data/sourcing/"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/data/sourcing/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/data/metrics"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/data/metrics/"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/data/metrics/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/data/featured-history.json"
to = "/404.html"
status = 404
force = true

