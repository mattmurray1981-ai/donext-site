<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You are on the list — DoNext {{name}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F0440B">
  <link href="https://api.fontshare.com/v2/css?f[]=sentient@500,600,700&amp;f[]=general-sans@400,500,600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/assets/brand/{{id}}/donext-{{id}}-avatar-v4.png" type="image/png" sizes="{{size}}x{{size}}">
  <link rel="apple-touch-icon" href="/assets/brand/{{id}}/donext-{{id}}-avatar-v4.png" sizes="{{size}}x{{size}}">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="wrap header-inner">
      <a class="wordmark" href="{{path}}" aria-label="DoNext {{name}} home">
        <img class="wordmark__logo" src="/assets/brand/{{id}}/donext-{{id}}-avatar-v4.png" width="{{size}}" height="{{size}}" alt="DoNext {{name}}">
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="{{path}}#weekend">This weekend</a>
      </nav>
    </div>
  </header>

  <main class="thank-you wrap narrow">
    <div>
      <h1>You are on the list</h1>
      <p>Thanks — your interest in DoNext {{name}} emails has been registered. We’re getting the email service ready; meanwhile, the latest {{name}} picks are here on the site.</p>
      <p><a class="btn" href="{{path}}">Back to DoNext</a></p>
    </div>
  </main>
  <script src="/assets/js/hit.js" defer></script>
</body>
</html>
